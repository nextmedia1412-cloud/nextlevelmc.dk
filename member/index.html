<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <meta name="robots" content="noindex" />
  <title>Next Level MC · Events</title>

  <link rel="icon" type="image/png" href="../assets/icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Next Level MC" />

  <link rel="preload" as="image" href="../assets/wall.png" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="./member.css" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="page-vignette" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <main class="site-shell member-shell">
    <header class="member-hero">
      <a class="member-logo" href="../" aria-label="Til forsiden">
        <img src="../assets/logo.png" alt="Next Level MC Danmark logo" />
      </a>
      <p class="kicker">Next Level MC</p>
      <h1>Events</h1>
      <p id="memberGreeting" class="subline">Danmark • 1412</p>
    </header>

    <section id="setupWarning" class="links-card member-card hidden">
      <p class="member-note">Supabase mangler. Indsæt SUPABASE_URL og SUPABASE_ANON_KEY i <strong>/shared/supabase-client.js</strong>.</p>
    </section>

    <section id="eventsPanel" class="hidden" aria-label="Kommende events">
      <div class="links-card member-card">
        <div class="section-title">
          <span></span>
          <p>Kommende events</p>
          <span></span>
        </div>

        <div id="eventList" class="button-stack"></div>
        <p id="eventsStatus" class="member-status"></p>

        <button id="addEventBtn" class="member-btn member-btn--ghost hidden" type="button">+ Tilføj event</button>
      </div>

      <div id="eventFormCard" class="links-card member-card hidden">
        <div class="section-title">
          <span></span>
          <p id="eventFormTitle">Nyt event</p>
          <span></span>
        </div>

        <form id="eventForm" class="member-form">
          <input id="editEventId" type="hidden" />
          <label>
            Navn
            <input id="eventTitle" type="text" maxlength="80" placeholder="fx Sæsonstart" required />
          </label>
          <div class="member-form__row">
            <label>
              Dato
              <input id="eventDate" type="date" required />
            </label>
            <label>
              Klokkeslæt
              <input id="eventTime" type="time" required />
            </label>
          </div>
          <label>
            Sted
            <input id="eventLocation" type="text" maxlength="120" placeholder="fx Klubhuset" required />
          </label>
          <label>
            Beskrivelse (valgfri)
            <textarea id="eventDescription" rows="3" placeholder="Praktisk info, tilmelding, mødested..."></textarea>
          </label>
          <div class="member-form__actions">
            <button id="eventSubmitBtn" class="member-btn" type="submit">Gem event</button>
            <button id="cancelEventBtn" class="member-btn member-btn--ghost" type="button">Annuller</button>
          </div>
          <p id="eventFormStatus" class="member-status"></p>
        </form>
      </div>

      <div id="loginPanel" class="links-card member-card member-card--narrow hidden">
        <div class="section-title">
          <span></span>
          <p>Log ind</p>
          <span></span>
        </div>

        <form id="loginForm" class="member-form">
          <label>
            Brugernavn
            <input id="loginName" name="username" type="text" autocomplete="username" autocapitalize="none" required />
          </label>
          <label>
            Adgangskode
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <label class="member-check">
            <input id="rememberLogin" type="checkbox" />
            Husk mig
          </label>
          <button class="member-btn" type="submit">Log ind</button>
          <p id="loginStatus" class="member-status"></p>
        </form>
      </div>

      <div id="pushPanel" class="links-card member-card member-card--narrow hidden">
        <div class="section-title">
          <span></span>
          <p>Notifikationer</p>
          <span></span>
        </div>

        <div class="member-form">
          <p id="pushHint" class="member-note"></p>
          <button id="pushToggleBtn" class="member-btn" type="button">Slå notifikationer til</button>
          <button id="pushTestBtn" class="member-btn member-btn--ghost hidden" type="button">Send prøve-notifikation</button>
          <p id="pushStatus" class="member-status"></p>
        </div>
      </div>

      <div id="adminPanel" class="links-card member-card hidden">
        <div class="section-title">
          <span></span>
          <p>Admin · Brugere</p>
          <span></span>
        </div>

        <div id="userList" class="user-list"></div>
        <p id="userStatus" class="member-status"></p>

        <form id="userForm" class="member-form user-form">
          <p class="member-form__heading">Tilføj bruger</p>
          <div class="member-form__row">
            <label>
              Navn
              <input id="newDisplayName" type="text" maxlength="40" placeholder="fx Malthe" autocomplete="off" required />
            </label>
            <label>
              Brugernavn
              <input id="newUsername" type="text" maxlength="30" placeholder="fx malthe" autocomplete="off" autocapitalize="none" required />
            </label>
          </div>
          <div class="member-form__row">
            <label>
              Adgangskode
              <input id="newPassword" type="text" minlength="6" placeholder="mindst 6 tegn" autocomplete="off" autocapitalize="none" required />
            </label>
            <label>
              Rettighed
              <select id="newRole">
                <option value="member">Medlem</option>
                <option value="admin">Admin</option>
              </select>
            </label>
          </div>
          <button id="userSubmitBtn" class="member-btn" type="submit">Tilføj bruger</button>
        </form>
      </div>

      <nav class="member-nav">
        <a href="../">Forside</a>
        <button id="showLoginBtn" type="button">Log ind</button>
        <button id="logoutBtn" class="hidden" type="button">Log ud</button>
      </nav>
    </section>
  </main>

  <footer class="footer">
    <span class="footer-line"></span>
    <p>Next Level MC • Danmark</p>
    <span class="footer-line"></span>
  </footer>

  <script type="module" src="./member.js"></script>
</body>
</html>
