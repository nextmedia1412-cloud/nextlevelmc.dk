<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Level MC | Website Under Opbygning</title>
    <meta name="description" content="Next Level MC officielle hjemmeside er under opbygning." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="noise"></div>

    <header class="topbar">
        <div class="brand-mini">NEXT LEVEL MC</div>
        <a class="member-btn" href="#" aria-label="Member login kommer snart">Member Login</a>
    </header>

    <main class="hero">
        <section class="card">
            <div class="eyebrow">Official Website</div>

            <div class="logo-wrap">
                <img src="assets/logo.png" alt="Next Level MC logo" class="logo" />
            </div>

            <h1>Website under opbygning</h1>

            <p class="subtitle">
                Noget større er på vej.
                <span>Next Level MC</span>
            </p>

            <div class="status-box">
                <div class="status-dot"></div>
                <span>Work in progress</span>
            </div>

            <div class="divider"></div>

            <p class="coming-text">
                Den offentlige side er under udvikling.
            </p>

            <div class="actions">
                <a class="action primary" href="https://www.facebook.com/profile.php?id=61583132950890" rel="noopener">Facebook side</a>
                <a class="action primary" href="https://www.facebook.com/groups/950969793666645" rel="noopener">Friends of Next Level MC</a>
                <a class="action primary" href="https://maps.app.goo.gl/VaZvpGmu2J6KtCV76" rel="noopener">Google Maps</a>
                <a class="action primary" href="https://www.facebook.com/malthe.engelhardtkofoed">Kontakt Road Captain</a>
            </div>

            <div class="footer-note">
                <span class="line"></span>
                <p>Next Level MC - Danmark</p>
                <span class="line"></span>
            </div>
        </section>
    </main>
</body>
</html>
