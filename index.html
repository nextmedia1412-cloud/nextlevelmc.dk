<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Next Level MC Danmark - officielle links og kontakt." />
  <title>Next Level MC Danmark</title>

  <link rel="preload" as="image" href="assets/wall.png" />
  <link rel="preload" as="image" href="assets/logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="page-vignette" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <main class="site-shell">
    <section class="hero" aria-label="Next Level MC">
      <div class="hero__inner">
        <div class="logo-stage reveal reveal-zoom">
          <img src="assets/logo.png" alt="Next Level MC Danmark logo" class="main-logo" />
        </div>

        <div class="intro reveal reveal-up">
          <p class="kicker">Official links</p>
          <h1>Next Level MC</h1>
          <p class="subline">Danmark • 1412</p>
        </div>
      </div>
    </section>

    <section class="links-section" aria-label="Links">
      <div class="links-card reveal reveal-up">
        <div class="section-title">
          <span></span>
          <p>Connect</p>
          <span></span>
        </div>

        <!--
          INDSÆT DINE LINKS HER:
          Skift href="#" til jeres rigtige links.
          target="_blank" gør at desktop åbner ny fane.
          På mobil vil Facebook/Instagram/Maps typisk åbne i app, hvis telefonen understøtter det.
        -->
        <div class="button-stack">
          <a class="glass-button reveal reveal-left" href="https://www.facebook.com/profile.php?id=61583132950890" target="_blank" rel="noopener noreferrer">
            <span class="button-icon">f</span>
            <span class="button-text">
              <strong>Facebook side</strong>
              <small>Følg klubben officielt</small>
            </span>
            <span class="button-arrow">↗</span>
          </a>

          <a class="glass-button reveal reveal-right" href="https://www.facebook.com/groups/950969793666645" target="_blank" rel="noopener noreferrer">
            <span class="button-icon">★</span>
            <span class="button-text">
              <strong>Facebook friends side</strong>
              <small>Community og opdateringer</small>
            </span>
            <span class="button-arrow">↗</span>
          </a>

          <a class="glass-button reveal reveal-left" href="https://maps.app.goo.gl/4ScMo9oPNUULsZB48" target="_blank" rel="noopener noreferrer">
            <span class="button-icon">⌖</span>
            <span class="button-text">
              <strong>Maps</strong>
              <small>Find os på kortet</small>
            </span>
            <span class="button-arrow">↗</span>
          </a>

          <a class="glass-button reveal reveal-right" href="https://www.instagram.com/next.level.mc.danmark/" target="_blank" rel="noopener noreferrer">
            <span class="button-icon">◎</span>
            <span class="button-text">
              <strong>Instagram</strong>
              <small>Se billeder</small>
            </span>
            <span class="button-arrow">↗</span>
          </a>

          <a class="glass-button glass-button--gold reveal reveal-up" href="https://www.facebook.com/malthe.engelhardtkofoed" target="_blank" rel="noopener noreferrer">
            <span class="button-icon">✉</span>
            <span class="button-text">
              <strong>Kontakt Road Captain</strong>
              <small>besøg og aftaler</small>
            </span>
            <span class="button-arrow">↗</span>
          </a>
        </div>
      </div>

      <div class="skull-mark reveal reveal-zoom" aria-hidden="true">
        <img src="assets/skull.png" alt="" />
      </div>
    </section>
  </main>

  <footer class="footer">
    <span class="footer-line"></span>
    <p>Next Level MC • Danmark</p>
    <span class="footer-line"></span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
